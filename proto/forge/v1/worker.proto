syntax = "proto3";

package forge.v1;

message WorkerDescriptor {
  string worker_id = 1;
  string endpoint = 2;
}

message WorkerCommand {
  string command_id = 1;
  string action = 2;
}

message WorkerCommandResult {
  string command_id = 1;
  bool accepted = 2;
}

service WorkerService {
  rpc Control(WorkerCommand) returns (WorkerCommandResult);
}

