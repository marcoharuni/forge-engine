syntax = "proto3";

package forge.v1;

message MetricsRequest {}

message MetricSample {
  string name = 1;
  double value = 2;
  map<string, string> labels = 3;
}

message MetricsResponse {
  repeated MetricSample samples = 1;
}

service MetricsService {
  rpc Snapshot(MetricsRequest) returns (MetricsResponse);
}

