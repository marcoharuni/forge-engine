name: Rust

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Metadata
        run: cargo metadata --manifest-path rust/Cargo.toml --no-deps
      - name: Check
        run: cargo check --manifest-path rust/Cargo.toml --workspace
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings

