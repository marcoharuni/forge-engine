name: Python

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Validate lockfile when present
        shell: bash
        run: |
          if [[ -f uv.lock ]]; then
            uv lock --check
          else
            echo "uv.lock is not present; lockfile validation skipped."
          fi
      - name: Install development environment
        run: uv sync --dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
      - name: Compile Python sources
        run: uv run python -m compileall -q src tests benchmarks examples scripts
      - name: Non-GPU tests
        run: uv run pytest -m "not gpu and not integration"

