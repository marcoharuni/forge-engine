name: Feature request
description: Propose a focused ForgeEngine improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What production use case or engineering constraint should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: Describe interfaces, compatibility concerns, and alternatives.
    validations:
      required: true

