[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["ForgeEngine contributors"]
repository = "https://github.com/OWNER/forge-engine"
description = "Standalone production-oriented LLM inference engine components."

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
bytes = "1.7"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
prometheus-client = "0.23"
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["macros", "net", "rt-multi-thread", "signal"] }
tonic = "0.13"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.10", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
