[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-engine"
version = "0.1.0"
description = "A small, readable, single-GPU inference engine for Qwen."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi",
    "huggingface-hub",
    "safetensors",
    "torch",
    "transformers",
    "uvicorn",
]

[project.scripts]
forge-engine = "forge_engine.cli:main"

[project.optional-dependencies]
dev = [
    "httpx",
    "httpx2",
    "modal",
    "pytest>=8",
]
cute = [
    "nvidia-cutlass-dsl[cu13]",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
